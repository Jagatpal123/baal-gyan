name: Build Test APK and Production AAB

# ==========================================
# YAHAN SE AAP SIRF VERSION BADAL SAKTE HAIN:
# ==========================================
env:
  APP_VERSION_CODE: 3
  APP_VERSION_NAME: "3.0.0"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm run build || true

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Configure Permissions, Native Android TTS & AdMob
      run: |
        # 1. SDK Settings
        if [ -f "android/variables.gradle" ]; then
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
        fi

        echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

        # 2. Automatically update Version from env
        sed -i "s/versionCode .*/versionCode ${APP_VERSION_CODE}/" android/app/build.gradle
        sed -i "s/versionName .*/versionName \"${APP_VERSION_NAME}\"/" android/app/build.gradle

        # 3. Inject App Icon safely
        if [ -f "logo.png" ]; then
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp logo.png "$dir/ic_launcher.png"
            cp logo.png "$dir/ic_launcher_round.png"
            cp logo.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done
        fi

        # 4. Android Permissions in Manifest
        if ! grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
        fi

        # 5. AdMob App ID
        if ! grep -q "APPLICATION_ID" android/app/src/main/AndroidManifest.xml; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~3000039098"\/>' android/app/src/main/AndroidManifest.xml
        fi

        # 6. Locate MainActivity.java and inject TTS & Permissions
        MAIN_ACTIVITY_PATH=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
        if [ -n "$MAIN_ACTIVITY_PATH" ]; then
          PACKAGE_NAME=$(grep -E "^package " "$MAIN_ACTIVITY_PATH" | head -n 1 | sed 's/package //;s/;//')
          echo "Found MainActivity at: $MAIN_ACTIVITY_PATH with package: $PACKAGE_NAME"

          cat << EOF > "$MAIN_ACTIVITY_PATH"
        package $PACKAGE_NAME;

        import android.os.Bundle;
        import android.webkit.JavascriptInterface;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebView;
        import android.speech.tts.TextToSpeech;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import android.content.pm.PackageManager;
        import android.Manifest;
        import java.util.Locale;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            private TextToSpeech tts;

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                // Hardware TTS Engine Initialization
                tts = new TextToSpeech(this, status -> {
                    if (status != TextToSpeech.ERROR) {
                        tts.setLanguage(new Locale("hi", "IN"));
                    }
                });

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                }

                WebView webView = getBridge().getWebView();
                webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                webView.getSettings().setJavaScriptEnabled(true);

                // Native Android Speech Bridge directly connected to phone speaker
                webView.addJavascriptInterface(new Object() {
                    @JavascriptInterface
                    public void speak(String text, String lang) {
                        if (tts != null) {
                            if (lang != null && lang.startsWith("en")) {
                                tts.setLanguage(Locale.US);
                            } else {
                                tts.setLanguage(new Locale("hi", "IN"));
                            }
                            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "BG_TTS");
                        }
                    }
                }, "AndroidTTS");

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }
                });
            }

            @Override
            public void onDestroy() {
                if (tts != null) {
                    tts.stop();
                    tts.shutdown();
                }
                super.onDestroy();
            }
        }
        EOF
        fi

    # --- STEP A: TEST AD WALI APK BANANA ---
    - name: Prepare, Build and Sign Test-Ad APK
      run: |
        TARGET_HTML="android/app/src/main/assets/public/index.html"
        if [ ! -f "$TARGET_HTML" ]; then
          TARGET_HTML=$(find android/app/src/main/assets -name "index.html" | head -n 1)
        fi

        # Replace with Google Official Test IDs
        sed -i 's/ca-app-pub-6302105448775587\/9146645040/ca-app-pub-3940256099942544\/6300978111/g' "$TARGET_HTML"
        sed -i 's/ca-app-pub-6302105448775587\/2277984366/ca-app-pub-3940256099942544\/5224354917/g' "$TARGET_HTML"
        sed -i 's/isTesting: false/isTesting: true/g' "$TARGET_HTML"

        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        echo "Using Build Tools: $BUILD_TOOLS_DIR"

        $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-aligned.apk
        $BUILD_TOOLS_DIR/apksigner sign --ks ../release.keystore --ks-key-alias bhakti --ks-pass pass:Jagatpal@2026 --key-pass pass:Jagatpal@2026 --out app/build/outputs/apk/release/BalGyan-TestAds.apk app/build/outputs/apk/release/app-aligned.apk

    # --- STEP B: PRODUCTION REAL AD WALI AAB BANANA ---
    - name: Prepare, Build and Sign Production AAB
      run: |
        TARGET_HTML="android/app/src/main/assets/public/index.html"
        if [ ! -f "$TARGET_HTML" ]; then
          TARGET_HTML=$(find android/app/src/main/assets -name "index.html" | head -n 1)
        fi

        # Revert to Real AdMob Production IDs
        sed -i 's/ca-app-pub-3940256099942544\/6300978111/ca-app-pub-6302105448775587\/9146645040/g' "$TARGET_HTML"
        sed -i 's/ca-app-pub-3940256099942544\/5224354917/ca-app-pub-6302105448775587\/2277984366/g' "$TARGET_HTML"
        sed -i 's/isTesting: true/isTesting: false/g' "$TARGET_HTML"

        cd android
        ./gradlew bundleRelease

        BUNDLE_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
        echo "Signing bundle at: $BUNDLE_PATH"

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 "$BUNDLE_PATH" bhakti
        cp "$BUNDLE_PATH" app/build/outputs/bundle/release/BalGyan-Production-RealAds.aab

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: BalGyan-TestAds-APK
        path: android/app/build/outputs/apk/release/BalGyan-TestAds.apk

    - name: Upload Production Real-Ad AAB
      uses: actions/upload-artifact@v4
      with:
        name: BalGyan-Production-RealAds-AAB
        path: android/app/build/outputs/bundle/release/BalGyan-Production-RealAds.aab
