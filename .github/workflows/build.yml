name: Build Signed Kids App AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install
        npm run build

    - name: Setup Capacitor Android
      run: |
        npx cap add android
        npx cap sync android

    - name: Configure SDK 36, Min SDK 24 & AdMob App ID
      run: |
        sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle

        sed -i 's/versionCode 1/versionCode 1/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.0"/g' android/app/build.gradle

        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~3000039098"\/>' android/app/src/main/AndroidManifest.xml

    - name: Build Android App Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Sign AAB with Permanent Keystore
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 android/app/build/outputs/bundle/release/app-release.aab bhakti

    - name: Upload Signed Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: BalGyan-Signed-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
